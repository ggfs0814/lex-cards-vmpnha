const BY={};CARDS.forEach(c=>BY[c.id]=c);

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(keepId){
  let ids=CARDS.filter(c=>(S.f==='all'||c.k===S.f)&&(S.sm||!S.m[c.id])).map(c=>c.id);

  if(keepId){const i=ids.indexOf(keepId); if(i>=0) S.pos=i;}
  save();
}
function valid(){ if(!Array.isArray(S.q)) return false; return S.q.every(id=>BY[id]); }
if(!valid()) build();
let revealed=false, unlocked=false;

function play(){ if(!S.q.length) return; au.currentTime=0; const p=au.play(); if(p&&p.catch)p.catch(()=>{}); }
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1200)}
function go(d){ if(!S.q.length) return; S.pos=(S.pos+d+S.q.length)%S.q.length; save(); render(-d); }
$('next').onclick=()=>go(1); $('prev').onclick=()=>go(-1); $('play').onclick=()=>{unlocked=true;play()};
$('again').onclick=()=>{ if(!S.q.length) return; const id=S.q[S.pos]; const at=Math.min(S.pos+5,S.q.length); S.q.splice(at,0,id); toast('稍后再来一遍'); go(1); };
$('ok').onclick=()=>{ if(!S.q.length) return; const id=S.q[S.pos];
  if(S.m[id]){delete S.m[id]; save(); toast('已取消掌握'); render(); return}
  S.m[id]=1;
  if(!S.sm){ S.q=S.q.filter(x=>x!==id); if(S.pos>=S.q.length) S.pos=0; save(); toast('已掌握 ✓'); render(-1); }
  else { save(); toast('已掌握 ✓'); go(1); } };
let tx=null,ty=null;
$('wrap').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('wrap').addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){unlocked=true; go(dx<0?1:-1);} },{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key===' '){e.preventDefault();play()}});
$('go').onclick=()=>{unlocked=true;$('start').classList.add('hidden');render();play();};
function syncPanel(){
  document.querySelectorAll('#f button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.f));
  document.querySelectorAll('#o button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.sh));
  $('sm').checked=!!S.sm;$('hc').checked=!!S.hc;$('ap').checked=!!S.ap;
  const nm=Object.keys(S.m).length; $('stat').textContent=`共 ${CARDS.length} 张卡片，已掌握 ${nm} 张。`;
  $('reshuf').classList.toggle('hidden',!S.sh);
}
const cur=()=>S.q&&S.q.length?S.q[S.pos]:null;
$('gear').onclick=()=>{syncPanel();$('panel').classList.remove('hidden')};
$('close').onclick=()=>{$('panel').classList.add('hidden')};
document.querySelectorAll('#f button').forEach(b=>b.onclick=()=>{S.f=b.dataset.v;build();syncPanel();render()});
document.querySelectorAll('#o button').forEach(b=>b.onclick=()=>{S.sh=+b.dataset.v;build(S.sh?null:cur());syncPanel();render()});
$('reshuf').onclick=()=>{build();toast('已重新打乱');render()};
$('sm').onchange=e=>{S.sm=e.target.checked?1:0;build(cur());render()};
$('hc').onchange=e=>{S.hc=e.target.checked?1:0;save();render()};
$('ap').onchange=e=>{S.ap=e.target.checked?1:0;save()};
$('reset').onclick=()=>{ if(confirm('确定清除所有“已掌握”记录吗？')){S.m={};build();syncPanel();render();toast('进度已重置')} };
if(new Set(CARDS.map(c=>c.k)).size<2){$('frow').classList.add('hidden');S.f='all';}
render();
</script></body></html>
